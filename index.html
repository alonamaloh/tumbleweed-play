<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HighNoon — Tumbleweed</title>
<style>
  :root { --bg:#f4efe6; --ink:#2b2620; --red:#c0392b; --neutral:#8a7f6d; --hex:#e2d8c3; --hexline:#b9ad94; }
  body { margin:0; min-height:100vh; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; box-sizing:border-box; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:#7a7161; margin-bottom:28px; text-align:center; }
  .choices { display:flex; gap:24px; flex-wrap:wrap; justify-content:center; }
  a.choice { display:flex; flex-direction:column; align-items:center; width:250px; padding:20px 18px 18px; border-radius:14px;
             background:#fbf8f1; border:1px solid #d8cfba; color:inherit; text-decoration:none; }
  a.choice:hover, a.choice:focus { border-color:#3a7d3a; box-shadow:0 2px 10px rgba(0,0,0,.08); outline:none; }
  a.choice svg { width:190px; height:176px; }
  .name { font-size:20px; font-weight:600; margin-top:10px; }
  .what { color:#7a7161; font-size:14px; }
</style>
</head>
<body>
<h1>HighNoon</h1>
<div class="sub">Play and analyse Tumbleweed. Choose a board.</div>
<div class="choices">
  <a class="choice" href="tw6/"><svg id="b6" viewBox="0 0 190 176"></svg><div class="name">Size 6</div><div class="what">91 cells</div></a>
  <a class="choice" href="tw8/"><svg id="b8" viewBox="0 0 190 176"></svg><div class="name">Size 8</div><div class="what">169 cells</div></a>
</div>
<script>
"use strict";
// a small picture of each board: every cell, with the neutral stack in the centre
function board(id, side){
  const n=2*side-1, m=side-1, size=88/(1.78*(side-0.4)), cx=95, cy=88; let s="";
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    if(Math.abs(c-r)>m) continue;
    const x=cx+(c-m-(r-m)/2)*size*1.78, y=cy+(r-m)*size*1.55; let p="";
    for(let k=0;k<6;k++){ const a=Math.PI/180*(60*k+30); p+=(k?"L":"M")+(x+size*Math.cos(a)).toFixed(1)+","+(y+size*Math.sin(a)).toFixed(1); }
    s+=`<path d="${p}Z" fill="${c===m&&r===m?'var(--neutral)':'var(--hex)'}" stroke="var(--hexline)" stroke-width="0.7"></path>`;
  }
  document.getElementById(id).innerHTML=s;
}
board('b6',6); board('b8',8);
</script>
</body>
</html>
